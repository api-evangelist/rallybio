name: Rallybio
description: >-
  Rallybio Corporation (NASDAQ RLYB) is a clinical-stage biotechnology company headquartered in
  New Haven, Connecticut, founded in 2018, developing and commercializing life-transforming
  therapies for patients with severe and rare diseases. Its pipeline spans maternal-fetal health,
  complement dysregulation, hematology, and metabolic disorders, led by RLYB116, a differentiated
  complement component 5 (C5) inhibitor, and RLYB332, a long-acting matriptase-2 (MTP-2) antibody
  for iron-overload disorders. The company was surfaced as a portfolio company of Canaan Partners
  and added to the API Evangelist network. As a pharmaceutical company it publishes no public
  developer API, SDK, or machine-readable API surface; this profile captures corporate identity only.
